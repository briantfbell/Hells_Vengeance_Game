<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Combat Idle Studio</title><style>*{box-sizing:border-box}body{background:#10141e;color:#eddbb7;font:15px Georgia;margin:24px}a{color:#e3bb7b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card{background:#211c27;border:1px solid #99754c;padding:8px;text-align:center}.card canvas{width:100%;height:200px;object-fit:contain;image-rendering:pixelated}button{background:#492732;color:#eedcb5;padding:8px;border:1px solid #b79562}h2{font-size:14px}small{font-size:11px;color:#bdab8b}</style></head><body><h1>Combat idle poses</h1><p>Three planted-foot weapon-ready frames per existing combatant, including prepared later encounters. Contains spoilers; Reese and Bruce are provisional. <a href="index.html">Game</a></p><button id="pause">Pause</button><p id="status">Loading…</p><div class="grid" id="cards"></div><script src="art-test/combat-idles.js"></script><script>
const models=[],ims={},reduce=matchMedia('(prefers-reduced-motion:reduce)');let running=true;document.getElementById('pause').onclick=e=>{running=!running;e.target.textContent=running?'Pause':'Play'};const load=src=>new Promise((resolve,reject)=>{const im=new Image;im.onload=()=>resolve(im);im.onerror=reject;im.src='art-test/'+src});(async()=>{try{await Promise.all([...new Set(Object.values(COMBAT_IDLES).map(m=>m.src))].map(async src=>ims[src]=await load(src)));for(const [id,m] of Object.entries(COMBAT_IDLES)){const card=document.createElement('article'),c=document.createElement('canvas'),title=document.createElement('h2'),note=document.createElement('small');card.className='card';c.width=240;c.height=230;title.textContent=id.replaceAll('_',' ');note.textContent='3 frames · '+(['reese','bruce'].includes(id)?'provisional':'weapon ready');card.append(title,c,note);document.getElementById('cards').append(card);models.push({id,m,c})}document.getElementById('status').textContent=models.length+' combatants loaded'}catch(e){document.getElementById('status').textContent='Could not load idle art'}})();let phase=0,last=0;function loop(t){if(last&&running&&!reduce.matches)phase+=(t-last)/1000;last=t;for(const {id,m,c} of models){const f=m.frames[m.cycle[Math.floor((phase+Object.keys(COMBAT_IDLES).indexOf(id)*.17)/.52)%4]],g=c.getContext('2d'),s=220/m.maxHeight;g.clearRect(0,0,c.width,c.height);g.imageSmoothingEnabled=false;g.drawImage(ims[m.src],f.x,f.y,f.w,f.h,120+(f.x-f.anchorX)*s,228-f.h*s,f.w*s,f.h*s)}requestAnimationFrame(loop)}requestAnimationFrame(loop);window.__idleStudio={state:()=>({loaded:models.length,phase})};
</script></body></html>
